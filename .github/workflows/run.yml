name: HubSpot to Google Ads report

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: python hubspot_to_google_ads.py
        env:
          HUBSPOT_KEY: ${{ secrets.HUBSPOT_KEY }}
          GCP_KEY: ${{ secrets.GCP_KEY }}
